<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lexi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Invisible form for Google Sheets logging -->
  <form id="post_data">
    <div style="display: none;">
      <input name="session_id_post" id="session_id" type="text" value="">
      <input name="user_content_post" id="user_content" type="text" value="">
      <input name="AI_content_post" id="AI_content" type="text" value="">
    </div>
  </form>

  <div class="chat">
    <div class="chat-title">
      <h1>Lexi</h1>
      <figure class="avatar">
        <img src="https://file.garden/Zdgccpzmo3pLm1w2/Melu.png" />
      </figure>
    </div>
    <div class="messages">
      <div class="messages-content"></div>
    </div>
    <div class="message-box">
      <textarea type="text" class="message-input" placeholder="Type message..."></textarea>
      <button type="submit" class="message-submit">Send</button>
    </div>
  </div>

  <!-- Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.concat.min.js"></script>

  <!-- App -->
  <script src="script.js"></script>

</body>
</html>
